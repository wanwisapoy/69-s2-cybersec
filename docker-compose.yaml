services:
  db:
    image: postgres:16-alpine
    container_name: 69-s2-db
    ports:
      - 127.0.0.1:${POSTGRES_PORT}:5432
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
      - APP_DB_USER=${APP_DB_USER}
      - APP_DB_PASSWORD=${APP_DB_PASSWORD}
    volumes:
      - ./data-postgres:/var/lib/postgresql/data
      - ./config/pg_hba.conf:/config/pg_hba.conf:ro
      - ./certs:/certs:ro
      - ./db-init:/docker-entrypoint-initdb.d:ro
    command:
      - sh
      - -c
      - |
        mkdir -p /etc/postgresql/ssl
        cp /certs/server.crt /etc/postgresql/ssl/server.crt
        cp /certs/server.key /etc/postgresql/ssl/server.key
        chown postgres:postgres /etc/postgresql/ssl/server.crt /etc/postgresql/ssl/server.key
        chmod 600 /etc/postgresql/ssl/server.key
        exec docker-entrypoint.sh postgres \
          -c listen_addresses='*' \
          -c password_encryption=scram-sha-256 \
          -c hba_file=/config/pg_hba.conf \
          -c ssl=on \
          -c ssl_cert_file=/etc/postgresql/ssl/server.crt \
          -c ssl_key_file=/etc/postgresql/ssl/server.key \
          -c ssl_min_protocol_version=TLSv1.2 \
          -c log_connections=on \
          -c log_disconnections=on \
          -c log_statement=mod \
          -c log_line_prefix='%m [%p] %u@%d '

  admin:
    image: dpage/pgadmin4:latest
    container_name: 69-s2-admin
    ports:
      - 127.0.0.1:${PGADMIN_DEFAULT_PORT}:80
    environment:
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED='True'
      - PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION='True'
    volumes:
      - ./data-pgadmin:/var/lib/pgadmin

  app:
    image: prawee/strapi
    container_name: 69-s2-app
    ports:
      - 127.0.0.1:${APP_PORT}:1337
    environment:
      - DATABASE_CLIENT=${DATABASE_CLIENT}
      - DATABASE_NAME=${DATABASE_NAME}
      - DATABASE_PORT=${DATABASE_PORT}
      - DATABASE_HOST=${DATABASE_HOST}
      - DATABASE_USERNAME=${APP_DB_USER}
      - DATABASE_PASSWORD=${APP_DB_PASSWORD}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
    volumes:
      - ./data-app:/srv/app
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  data-postgres:
  data-pgadmin:
  data-app: